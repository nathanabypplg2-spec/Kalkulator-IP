<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kalkulator Subnet & VLSM SMK BRANTAS KARANGKATES</title>
    <style>
        :root {
            --bg: #fff;
            --card: #f8f9fa;
            --tx: #202124;
            --mut: #5f6368;
            --ac: #1a73e8;
            --bd: #dadce0;
            --er: #d93025;
            --net: #1a73e8;
            --hst: #e37400
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #202124;
                --card: #2d2e31;
                --tx: #e8eaed;
                --mut: #9aa0a6;
                --ac: #8ab4f8;
                --bd: #5f6368;
                --er: #f28b82;
                --net: #8ab4f8;
                --hst: #fdd663
            }
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--tx);
            max-width: 1120px;
            margin: 0 auto;
            padding: 16px
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px
        }

        .tabs button {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--bd);
            background: var(--bg);
            color: var(--tx);
            border-radius: 20px;
            cursor: pointer
        }

        .tabs button.on {
            background: var(--ac);
            color: #fff;
            border-color: var(--ac)
        }

        .card {
            background: var(--bg);
            border: 1px dotted #777;
            border-radius: 0;
            padding: 10px;
            margin-bottom: 12px
        }

        input {
            padding: 10px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--bg);
            color: var(--tx);
            font-size: 16px;
            max-width: 100%;
            box-sizing: border-box
        }

        .go {
            background: var(--ac);
            color: #fff;
            border: 0;
            border-radius: 20px;
            padding: 10px 22px;
            cursor: pointer;
            font-size: 16px
        }

        .err {
            color: var(--er);
            margin-top: 8px
        }

        .mut {
            color: var(--mut)
        }

        .scroll {
            overflow-x: auto
        }

        table {
            border-collapse: collapse;
            width: 100%
        }

        td,
        th {
            padding: 6px 8px;
            text-align: left;
            border-bottom: 1px solid var(--bd);
            white-space: nowrap
        }

        .b {
            font-family: monospace
        }

        .n {
            color: var(--net)
        }

        .h {
            color: var(--hst)
        }

        .hide {
            display: none
        }

        .row {
            display: flex;
            gap: 6px;
            margin: 6px 0
        }
        .classic-form { display:flex; flex-wrap:wrap; align-items:end; gap:8px }
        .field { display:flex; flex-direction:column; gap:4px }
        .field label { font-size:20px }
        .classic-form input { border-radius:0; padding:3px; font-size:18px; height:28px }
        #ip,#new-pf { width:250px }
        #pf { width:250px }
        .slash { font-size:22px; padding-bottom:3px }
        .classic-button { border:1px solid #888; border-radius:3px; background:#eee; color:#111; padding:4px 12px; font-size:18px }
        #r1 { margin-top:88px; color:var(--tx) }
        #r1 table { width:auto }
        #r1 td,#r1 th { border:0; padding:2px 12px 2px 0; font:18px monospace }
        #r1 th { font-weight:normal; min-width:105px }
        #r1 td:nth-child(2) { color:blue; min-width:220px }
        #r1 .b { color:#888 }
        .netbit { color:green }
        .hostbit { color:red }
        .prefix-note { color:#555; font:16px Arial,sans-serif }
        .subnet-errors { color:red; font:18px monospace; white-space:pre-line; margin:24px 0 0 4px }
        @media(max-width:700px) { .field label {font-size:16px} #ip,#pf,#new-pf {width:min(250px,75vw)} #r1 {margin-top:40px} }
    </style>
</head>

<body>
    <h2>Kalkulator Subnet & VLSM SMK BRANTAS KARANGKATES YOMAN</h2>
    <div class="tabs"><button id="t1" class="on" onclick="tab(1)">Subnet</button><button id="t2"
            onclick="tab(2)">VLSM</button></div>

    <div id="p1" class="card">
        <form class="classic-form" onsubmit="event.preventDefault(); subnet()">
            <div class="field"><label for="ip"><b>Address</b> (Host or Network)</label><input id="ip" value="192.168.0.1" autofocus></div>
            <span class="slash">/</span>
            <div class="field"><label for="pf"><b>Netmask</b> (i.e. 24)</label><input id="pf" type="number" min="0" max="32" value="24"></div>
            <div class="field"><label for="new-pf"><b>Netmask</b> for sub/supernet (optional)</label><input id="new-pf" type="number" min="0" max="32" placeholder="move to:"></div>
            <button class="classic-button" type="submit">Calculate</button>
        </form>
        <div id="e1" class="subnet-errors"></div>
        <div id="r1" class="scroll"></div>
    </div>

    <div id="p2" class="card hide">
        <input id="nw" placeholder="Network CIDR" value="192.168.1.0/24">
        <div id="ks"></div>
        <button onclick="add('')">+ Tambah kebutuhan</button>
        <button class="go" onclick="vlsm()">Alokasikan</button>
        <div id="e2" class="err"></div>
        <div id="r2" class="scroll mut">Isi kebutuhan host tiap subnet.</div>
    </div>

    <script>
        const $ = i => document.getElementById(i);
        function tab(n) { [1, 2].forEach(i => { $('p' + i).classList.toggle('hide', i != n); $('t' + i).classList.toggle('on', i == n) }) }
        function col(b, p) { let o = '', c = 0; for (const ch of b) { if (ch == '.') { o += '.'; continue } o += `<span class="${c < p ? 'netbit' : 'hostbit'}">${ch}</span>`; c++ } return `<span>${o}</span>` }
        async function call(url, opt, eid) {
            $(eid).textContent = '';
            const r = await fetch(url, opt), d = await r.json();
            if (!r.ok) { $(eid).textContent = d.detail || 'Terjadi kesalahan'; return null } return d
        }
        async function subnet() {
            const d = await call(`/api/subnet?ip=${encodeURIComponent($('ip').value)}&prefix=${encodeURIComponent($('pf').value)}`, {}, 'e1');
            if (!d) return; const p = d.prefix;
            const rows = [['Address:', $('ip').value, d.ip_bin], ['Netmask:', `${d.mask} = ${p}`, d.mask_bin],
            ['Wildcard', d.wildcard, ''], ['Network', `${d.network}/${p}`, d.network_bin],
            ['Broadcast', d.broadcast ?? '— (tidak ada)', d.broadcast ? d.broadcast_bin : ''],
            ['HostMin', d.first_host, ''], ['HostMax', d.last_host, ''], ['Hosts/Net', d.usable_hosts + ` (kelas ${d.kelas})`, '']];
            const moveTo = $('new-pf').value;
            if (moveTo !== '' && (!/^\d+$/.test(moveTo) || Number(moveTo) > 32)) { $('e1').textContent = 'Netmask tujuan harus berupa prefix 0–32'; return; }
            const notes = [];
            if (moveTo !== '') { const target = Number(moveTo); if (target > p) notes.push(`New subnet: ${2 ** (target-p)} subnets of /${target}`); else if (target < p) notes.push(`Supernet: combines ${2 ** (p-target)} networks into /${target}`); else notes.push(`Netmask tetap /${target}`); }
            $('r1').innerHTML = '<table>' + rows.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td><td class="b">${r[2] ? col(r[2], p) : ''}</td></tr>`).join('') + '</table>' + notes.map(n => `<div class="prefix-note">${n}</div>`).join('')
        }
        function add(v) {
            const d = document.createElement('div'); d.className = 'row';
            d.innerHTML = `<input type="number" min="1" value="${v}" placeholder="jumlah host"><button onclick="this.parentNode.remove()">Hapus</button>`; $('ks').appendChild(d)
        }
        [100, 50, 20, 2].forEach(add);
        async function vlsm() {
            const k = [...document.querySelectorAll('#ks input')].map(i => i.value === '' ? 0 : Number(i.value));
            const d = await call('/api/vlsm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ network: $('nw').value, kebutuhan_host: k }) }, 'e2');
            if (!d) return;
            $('r2').innerHTML = '<table><tr><th>Butuh</th><th>Network</th><th>Mask</th><th>Host</th><th>Broadcast</th><th>Jumlah</th></tr>' +
                d.map(b => `<tr><td>${b.kebutuhan}</td><td>${b.network_cidr}</td><td>${b.mask}</td><td>${b.first_host} – ${b.last_host}</td><td>${b.broadcast ?? '—'}</td><td>${b.usable_hosts}</td></tr>`).join('') + '</table>'
        }
    </script>
</body>

</html>
